name: rolewatch
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 rolewatch.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
      - run: |
          git config user.name "rolewatch"
          git config user.email "rolewatch@users.noreply.github.com"
          git add -A
          git commit -m "scan" || echo "no changes"
          git pull --rebase origin main
          git push
