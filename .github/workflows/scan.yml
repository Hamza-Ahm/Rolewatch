name: rolewatch
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 rolewatch.py
      - run: |
          if [ -f docs/roles.json ]; then cp docs/roles.json roles.json; fi
          git config user.name "rolewatch"
          git config user.email "rolewatch@users.noreply.github.com"
          git add -A
          git commit -m "scan" || echo "no changes"
          git push
