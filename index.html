<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rolewatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFF2; --card:#FFFFFF; --ink:#0F1419; --muted:#69727C;
  --rule:#D4D9DF; --signal:#1A3FE0; --signal-soft:#E4E8FC;
  --gut:78px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- masthead ---------- */
header{
  border-bottom:1px solid var(--rule); background:var(--card);
  position:sticky; top:0; z-index:20;
}
.mast{
  max-width:1120px; margin:0 auto; padding:18px 24px;
  display:flex; align-items:baseline; gap:20px; flex-wrap:wrap;
}
.wordmark{
  font-family:var(--display); font-weight:800; font-size:26px;
  letter-spacing:-.035em; margin:0; font-variation-settings:'wdth' 85;
}
.wordmark span{color:var(--signal)}
.tally{
  font-family:var(--mono); font-size:12px; color:var(--muted);
  letter-spacing:.02em; margin-right:auto;
}
.tally b{color:var(--ink);font-weight:600}
.ghost{
  background:none; border:1px solid var(--rule); border-radius:2px;
  padding:6px 11px; font-size:12px; font-family:var(--mono); color:var(--muted);
}
.ghost:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- shell ---------- */
.shell{max-width:1120px;margin:0 auto;padding:26px 24px 80px;
  display:grid;grid-template-columns:196px 1fr;gap:36px}
aside{position:sticky;top:92px;align-self:start}
.fgroup{margin-bottom:26px}
.flabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:9px;
}
.chip{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:4px 0;color:var(--muted);font-size:14px;
  border-bottom:1px solid transparent;
}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"→ ";color:var(--signal)}
input[type=search],select{
  width:100%;background:var(--card);border:1px solid var(--rule);
  border-radius:2px;padding:7px 9px;font:inherit;font-size:13px;color:var(--ink);
}
input[type=range]{width:100%;accent-color:var(--signal)}
.rangeval{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- role rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{
  background:var(--card);border:1px solid var(--rule);border-radius:3px;
  display:grid;grid-template-columns:var(--gut) 1fr;overflow:hidden;
}
.row.done{opacity:.42}
.gutter{
  border-right:1px solid var(--rule);padding:16px 0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:linear-gradient(var(--signal-soft),var(--signal-soft)) no-repeat bottom/100% var(--fill,0%);
}
.num{
  font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.04em;
  line-height:1;color:var(--signal);
}
.num.low{color:var(--muted)}
.numcap{font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:5px}
.meat{padding:15px 18px 13px;min-width:0}
.rtitle{
  font-family:var(--display);font-weight:700;font-size:18px;
  letter-spacing:-.02em;line-height:1.22;margin:0 0 3px;
}
.rtitle a{text-decoration:none}
.rtitle a:hover{text-decoration:underline;text-decoration-color:var(--signal)}
.rmeta{font-size:13px;color:var(--muted);margin-bottom:9px}
.rmeta b{color:var(--ink);font-weight:500}
.flag{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--signal);border:1px solid var(--signal);border-radius:2px;
  padding:1px 4px;margin-left:7px;vertical-align:1px;
}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.01em;
  background:var(--signal-soft);color:var(--signal);padding:2px 6px;border-radius:2px;
}
.tag.neg{background:none;color:var(--muted);border:1px solid var(--rule)}
.acts{display:flex;gap:7px;flex-wrap:wrap}
.act{
  border:1px solid var(--rule);background:none;border-radius:2px;
  padding:5px 12px;font-size:12.5px;color:var(--muted);
}
.act:hover{border-color:var(--ink);color:var(--ink)}
.act.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.act.go{border-color:var(--signal);color:var(--signal)}
.act.go:hover{background:var(--signal);color:var(--card)}

.act.letter{border-color:var(--signal);color:var(--signal)}
.panel{margin-top:13px;border-top:1px solid var(--rule);padding-top:13px}
.panel pre{
  white-space:pre-wrap;font-family:var(--body);font-size:14px;line-height:1.62;
  margin:0 0 11px;color:var(--ink);max-width:62ch;
}
.empty{
  border:1px dashed var(--rule);border-radius:3px;padding:42px 26px;
  text-align:center;color:var(--muted);
}
.empty p{margin:0 0 6px}
.foot{margin-top:34px;font-family:var(--mono);font-size:11px;color:var(--muted)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;gap:22px;padding:18px 16px 60px}
  aside{position:static}
  .fgroup{margin-bottom:16px}
  :root{--gut:60px}
  .num{font-size:22px}
}
@media (prefers-reduced-motion:no-preference){
  .row{transition:opacity .14s ease}
}
</style>
</head>
<body>

<header>
  <div class="mast">
    <h1 class="wordmark">Role<span>watch</span></h1>
    <div class="tally" id="tally">Loading</div>
    <button class="ghost" id="export">Export</button>
    <button class="ghost" id="import">Import</button>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="fgroup">
      <div class="flabel">Status</div>
      <div id="statusFilters"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Minimum match</div>
      <input type="range" id="minScore" min="0" max="90" step="5" value="0">
      <div class="rangeval" id="minScoreVal">any</div>
    </div>
    <div class="fgroup">
      <div class="flabel">Place</div>
      <select id="place"><option value="">Anywhere</option></select>
    </div>
    <div class="fgroup">
      <div class="flabel">Search</div>
      <input type="search" id="q" placeholder="title or company">
    </div>
  </aside>

  <main>
    <div class="rows" id="rows"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<input type="file" id="file" accept="application/json" hidden>

<script>
const KEY = "rolewatch.status.v1";
const STATES = [
  ["open","Open"], ["new","New"], ["shortlist","Shortlist"],
  ["applied","Applied"], ["skipped","Skipped"], ["all","Everything"]
];

let DATA = {roles:[], updated:""};
let MARKS = load();
let filter = {status:"open", min:0, place:"", q:""};

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e){ return {}; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(MARKS)); }
  catch(e){ /* private browsing, marks last the session only */ }
}

function mark(id, state){
  if (MARKS[id] === state) delete MARKS[id]; else MARKS[id] = state;
  save(); render();
}

function visible(){
  return DATA.roles.filter(r => {
    const m = MARKS[r.id];
    if (filter.status === "open"      && (m === "applied" || m === "skipped")) return false;
    if (filter.status === "new"       && (!r.is_new || m)) return false;
    if (filter.status === "shortlist" && m !== "shortlist") return false;
    if (filter.status === "applied"   && m !== "applied") return false;
    if (filter.status === "skipped"   && m !== "skipped") return false;
    if (r.score < filter.min) return false;
    if (filter.place && !r.location.toLowerCase().includes(filter.place.toLowerCase())) return false;
    if (filter.q){
      const hay = (r.title + " " + r.company + " " + r.location).toLowerCase();
      if (!hay.includes(filter.q.toLowerCase())) return false;
    }
    return true;
  });
}

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function render(){
  const rows = document.getElementById("rows");
  const list = visible();

  const counts = {applied:0, shortlist:0, skipped:0};
  Object.values(MARKS).forEach(v => { if (counts[v] !== undefined) counts[v]++; });
  const fresh = DATA.roles.filter(r => r.is_new && !MARKS[r.id]).length;

  document.getElementById("tally").innerHTML =
    `<b>${DATA.roles.length}</b> open &middot; <b>${fresh}</b> new &middot; ` +
    `<b>${counts.shortlist}</b> shortlisted &middot; <b>${counts.applied}</b> applied`;

  document.getElementById("foot").textContent =
    (DATA.updated ? "Last scan " + DATA.updated + ". " : "") +
    "Your applied and skipped marks live in this browser only. Export to keep a copy.";

  if (!list.length){
    rows.innerHTML = `<div class="empty">
      <p>Nothing matches these filters.</p>
      <p>Widen the minimum match, or switch status to Everything.</p></div>`;
    return;
  }

  rows.innerHTML = list.map(r => {
    const m = MARKS[r.id] || "";
    const done = (m === "applied" || m === "skipped") ? " done" : "";
    const tags = (r.matched || []).map(t => t.startsWith("- ")
      ? `<span class="tag neg">${esc(t.slice(2))}</span>`
      : `<span class="tag">${esc(t)}</span>`).join("");
    const link = r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`
                       : esc(r.title);
    return `<article class="row${done}">
      <div class="gutter" style="--fill:${r.score}%">
        <div class="num${r.score < 40 ? " low" : ""}">${r.score}</div>
        <div class="numcap">match</div>
      </div>
      <div class="meat">
        <h2 class="rtitle">${link}${r.is_new && !m ? '<span class="flag">new</span>' : ""}</h2>
        <div class="rmeta"><b>${esc(r.company)}</b> &middot; ${esc(r.location)} &middot; seen ${esc(r.first_seen)}</div>
        <div class="tags">${tags}</div>
        <div class="acts">
          ${r.url ? `<a class="act go" href="${esc(r.url)}" target="_blank" rel="noopener">Open ad</a>` : ""}
          <button class="act${m==="shortlist"?" on":""}" data-id="${esc(r.id)}" data-s="shortlist">Shortlist</button>
          <button class="act${m==="applied"?" on":""}"   data-id="${esc(r.id)}" data-s="applied">Applied</button>
          <button class="act${m==="skipped"?" on":""}"   data-id="${esc(r.id)}" data-s="skipped">Skip</button>
          ${r.letter ? `<button class="act letter" data-letter="${esc(r.id)}">Draft letter</button>` : ""}
        </div>
        ${r.letter ? `<div class="panel" id="p-${esc(r.id)}" hidden>
          <pre>${esc(r.letter)}</pre>
          <button class="act" data-copy="${esc(r.id)}">Copy letter</button>
        </div>` : ""}
      </div>
    </article>`;
  }).join("");

  rows.querySelectorAll("button[data-s]").forEach(b =>
    b.addEventListener("click", () => mark(b.dataset.id, b.dataset.s)));

  rows.querySelectorAll("button[data-letter]").forEach(b =>
    b.addEventListener("click", () => {
      const p = document.getElementById("p-" + b.dataset.letter);
      p.hidden = !p.hidden;
      b.textContent = p.hidden ? "Draft letter" : "Hide letter";
    }));

  rows.querySelectorAll("button[data-copy]").forEach(b =>
    b.addEventListener("click", () => {
      const t = document.querySelector("#p-" + b.dataset.copy + " pre").textContent;
      navigator.clipboard.writeText(t).then(() => {
        b.textContent = "Copied";
        setTimeout(() => { b.textContent = "Copy letter"; }, 1400);
      });
    }));
}

function buildFilters(){
  const box = document.getElementById("statusFilters");
  box.innerHTML = STATES.map(([v,l]) =>
    `<button class="chip" data-v="${v}" aria-pressed="${v===filter.status}">${l}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    filter.status = b.dataset.v;
    box.querySelectorAll(".chip").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.v === filter.status));
    render();
  }));

  const places = [...new Set(DATA.roles.map(r => r.location.split(",")[0].trim()))]
    .filter(Boolean).sort();
  const sel = document.getElementById("place");
  places.forEach(p => {
    const o = document.createElement("option");
    o.value = p; o.textContent = p; sel.appendChild(o);
  });
  sel.addEventListener("change", () => { filter.place = sel.value; render(); });

  const rs = document.getElementById("minScore");
  rs.addEventListener("input", () => {
    filter.min = +rs.value;
    document.getElementById("minScoreVal").textContent = rs.value === "0" ? "any" : rs.value + " and up";
    render();
  });

  let t;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(t);
    t = setTimeout(() => { filter.q = e.target.value; render(); }, 160);
  });

  document.getElementById("export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(MARKS, null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rolewatch-marks.json";
    a.click();
  });

  const file = document.getElementById("file");
  document.getElementById("import").addEventListener("click", () => file.click());
  file.addEventListener("change", () => {
    const f = file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        MARKS = Object.assign(MARKS, JSON.parse(rd.result));
        save(); render();
      } catch(e){
        alert("That file isn't a rolewatch export.");
      }
    };
    rd.readAsText(f);
  });
}

fetch("roles.json?" + Date.now())
  .then(r => r.json())
  .then(d => { DATA = d; buildFilters(); render(); })
  .catch(() => {
    document.getElementById("tally").textContent = "No roles.json yet";
    document.getElementById("rows").innerHTML =
      `<div class="empty"><p>No scan results found.</p>
       <p>Run the scan once, then reload this page.</p></div>`;
  });
</script>
</body>
</html>
